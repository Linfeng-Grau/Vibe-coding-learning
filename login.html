<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户登录 · 南京工业大学</title>
<meta name="description" content="南京工业大学门户网站用户登录：学生、教师与管理员分角色进入对应服务。">
<meta name="theme-color" content="#14417a">
<link rel="icon" type="image/jpeg" href="assets/images/njtech-emblem.jpg">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">

<a class="skip-link" href="#main">跳到主要内容</a>

<header id="site-header"></header>

<main id="main">

  <section class="auth-page">
    <div class="container auth-grid">

      <!-- ============ 登录表单 ============ -->
      <div class="auth-card">
        <h1 data-i18n="login.title"></h1>
        <p data-i18n="login.subtitle"></p>

        <div class="alert alert-error hidden" id="login-error" role="alert"></div>

        <form class="form" id="login-form" novalidate>
          <div class="field">
            <label for="username" data-i18n="login.username"></label>
            <input class="input" type="text" id="username" name="username"
                   data-i18n-placeholder="login.usernamePlaceholder"
                   autocomplete="username" required>
            <p class="field-error" id="username-error"></p>
          </div>

          <div class="field">
            <label for="password" data-i18n="login.password"></label>
            <input class="input" type="password" id="password" name="password"
                   data-i18n-placeholder="login.passwordPlaceholder"
                   autocomplete="current-password" required>
            <p class="field-error" id="password-error"></p>
          </div>

          <label class="checkbox">
            <input type="checkbox" id="remember" checked>
            <span data-i18n="login.remember"></span>
          </label>

          <button class="btn btn-block" type="submit" id="login-submit" data-i18n="login.submit"></button>
        </form>

        <div class="alert alert-info mt-3" style="font-size:12.5px" data-i18n="login.demo.desc"></div>
        <div id="storage-warning"></div>
      </div>

      <!-- ============ 演示账号 ============ -->
      <div class="auth-card">
        <h1 style="font-size:19px" data-i18n="login.demo.title"></h1>
        <p class="text-muted" style="font-size:13.5px" data-i18n="login.demo.click"></p>
        <div class="demo-accounts" id="demo-accounts"></div>

        <div class="alert alert-warn mt-3" style="font-size:12.5px">
          <strong data-i18n="login.demo.title"></strong>：
          <span data-i18n="login.demo.desc"></span>
        </div>

        <a class="btn btn-outline btn-block mt-2" href="index.html" data-i18n="login.goHome"></a>
      </div>

    </div>
  </section>

</main>

<footer id="site-footer"></footer>

<script src="js/store.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/pages/login.js"></script>
</body>
</html>
