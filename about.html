<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>学校概况 · 南京工业大学</title>

<header id="site-header"></header>

<main id="main">

  <section class="page-hero">
    <div class="container">
      <ul class="breadcrumb">
        <li><a href="index.html" data-i18n="nav.home"></a></li>
        <li data-i18n="nav.about"></li>
      </ul>
      <h1 data-i18n="about.title"></h1>
      <p data-i18n="about.desc"></p>
    </div>
  </section>

  <!-- ================= 学校简介 + 基本情况 ================= -->
  <section class="section">
    <div class="container grid grid-sidebar">
      <div>
        <h2 class="section-title" data-i18n="about.intro.title"></h2>
        <div class="card mt-3 prose" id="intro-body"></div>

        <h2 class="section-title mt-4" data-i18n="about.motto.title"></h2>
        <div class="card mt-3" id="motto-card"></div>

        <h2 class="section-title mt-4" data-i18n="about.timeline.title"></h2>
        <p class="section-desc mb-2" data-i18n="about.timeline.desc"></p>
        <div class="card">
          <ul class="timeline" id="timeline"></ul>
        </div>
      </div>

        <h2 class="section-title" data-i18n="about.facts.title"></h2>

          <dl class="info-list" id="facts-list"></dl>
        </div>
      </aside>
    </div>
  </section>

  <!-- ================= 现任领导 ================= -->
  <section class="section section-alt">
    <div class="container">
      <div class="section-head">
        <div>
          <h2 class="section-title" data-i18n="about.leaders.title"></h2>
          <p class="section-desc" data-i18n="about.leaders.desc"></p>
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table" style="min-width:480px">
          <thead>
            <tr>
              <th style="width:200px" data-i18n="about.leaders.name"></th>
              <th data-i18n="about.leaders.post"></th>
            </tr>
          </thead>
          <tbody id="leaders-body"></tbody>
        </table>
      </div>
    </div>

  <section class="section">
    <div class="container">
      <div class="section-head">
        <div>
          <h2 class="section-title" data-i18n="about.campus.title"></h2>
          <p class="section-desc" data-i18n="about.campus.desc"></p>
        </div>
      </div>
      <div class="grid grid-3" id="campus-grid"></div>
    </div>
